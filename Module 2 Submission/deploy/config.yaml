# Serving configuration for qwen14b-code-trainer-v6 in RTPI.
# Consumed by deploy scripts and documented in deployment-plan.md §2.3.
# Override any value with the matching environment variable in .env.

model:
  hf_repo: cmndcntrlcyber/qwen14b-code-trainer-v6-gguf
  gguf_file: Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
  quantization: Q4_K_M          # alternatives: Q5_K_M, Q8_0, F16
  base_model: Qwen/Qwen2.5-Coder-14B-Instruct
  role_tag: qwen2.5-coder:14b   # RTPI role this model fills (code / tool-use)
  license: Apache-2.0

serving:
  backend: ollama               # ollama | vllm | rkllama
  host: 127.0.0.1
  port: 11434                   # vLLM uses 18000
  context_window: 4096          # raise to 8192 on >=16GB VRAM
  max_output_tokens: 2048
  n_gpu_layers: 999             # 0 for CPU fallback
  num_parallel: 2               # OLLAMA_NUM_PARALLEL
  max_loaded_models: 2
  keep_alive: 30m               # auto-unload idle VRAM (cost lever)

sampling:
  agent:                        # deterministic paths (tool calls, templates)
    temperature: 0.2
    top_p: 0.9
  chat:                         # human brainstorming
    temperature: 0.7
    top_p: 0.95

monitoring:
  enabled: true
  prometheus_port: 9090
  grafana_port: 3000
  scrape_interval: 15s

security:
  bind_localhost_only: true     # never expose the inference port publicly
  air_gap_mode: false           # true disables all cloud fallback
  verify_sha256: ""             # set to pin GGUF integrity in deploy_ollama.sh
