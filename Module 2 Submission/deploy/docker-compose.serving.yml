# Self-contained serving + monitoring stack for qwen14b-code-trainer-v6.
# Mirrors the inference services already in the parent RTPI docker-compose.yml,
# bundled here so the Module 2 deployment is reproducible standalone.
#
#   docker compose -f docker-compose.serving.yml up -d ollama
#   docker compose -f docker-compose.serving.yml --profile monitoring up -d
#   docker compose -f docker-compose.serving.yml --profile vllm up -d
#
# After Ollama is up, register the fine-tuned model:  ./deploy_ollama.sh
name: rtpi-m2-serving

services:
  # ── Default backend: Ollama (Tier B, single GPU) ───────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: m2-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"        # localhost only (plan §6.1)
    volumes:
      - ollama-models:/root/.ollama
      - ./:/work:ro                    # Modelfile + GGUF available at /work
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── Tier C backend: vLLM (high throughput, opt-in) ─────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: m2-vllm
    profiles: ["vllm"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command:
      - "--model=${VLLM_MODEL:-cmndcntrlcyber/qwen14b-code-trainer-v6}"
      - "--port=8000"
      - "--max-model-len=8192"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Observability (opt-in: --profile monitoring) ───────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: m2-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: m2-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/qwen-coder.json:ro

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: m2-dcgm
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  ollama-models:
  vllm-hf-cache:
  prometheus-data:
  grafana-data:
