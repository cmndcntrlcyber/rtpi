# Prometheus scrape config for the qwen14b-code-trainer-v6 serving stack.
# Referenced by deployment-plan.md §5.3.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml   # see alert definitions below (commented inline)

scrape_configs:
  # vLLM exposes native Prometheus metrics at /metrics (latency, tokens, etc.)
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["m2-vllm:8000"]

  # GPU telemetry: utilization, VRAM, temp, power
  - job_name: dcgm
    static_configs:
      - targets: ["m2-dcgm:9400"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

