# RTPI Workbench Frontend nginx override.
#
# The upstream image
# (ghcr.io/center-for-threat-informed-defense/attack-workbench-frontend) ships
# with the default nginx config — no SPA fallback and no /api/ proxy. That
# breaks every client-side route (e.g. /matrices, /tactics) with a 404 and
# breaks every backend call from the Angular bundle, which assumes a relative
# /api/ that nginx forwards to workbench-api.
#
# This file replaces /etc/nginx/conf.d/default.conf in the container.
# Mounted by docker-compose.yml under the workbench-frontend service.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost _;

    add_header Content-Security-Policy "frame-ancestors 'self' https://*.attck.nexus" always;
    add_header X-Frame-Options "" always;

    # ── REST API proxy ───────────────────────────────────────────────────────
    # The Angular SPA calls /api/... on its own origin. Forward those requests
    # to the workbench-api container on the same docker network.
    location /api/ {
        proxy_pass         http://workbench-api:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Static SPA with HTML5 history fallback ──────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
