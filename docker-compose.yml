      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sysreptor-redis:
    image: bitnami/redis:latest
    container_name: rtpi-sysreptor-redis
    profiles:
      - sysreptor
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${SYSREPTOR_REDIS_PASSWORD:-sysreptorredispassword}
    networks:
      - rtpi-network
    dns:
