      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # vLLM — Qwen3.5-9B serving (v2.9.1 Phase 6, RTPI_INFERENCE_PROVIDER=vllm)
  # OpenAI-compatible inference for agentic workloads on Blackwell-class GPUs.
  # Tool-call parsing happens server-side via --tool-call-parser qwen3_coder;
  # the orchestrator's mcp-invoker (Phase 5) handles MCP dispatch.
  # Usage: docker compose --profile vllm up -d
  # Set VLLM_BASE_URL=http://rtpi-vllm:8000 in app env.
  # NOTE: For Blackwell sm_120 (RTX 5060 Ti) the published nightly may need
  # a source rebuild — see docs/enhancements/2.9/references/Inference-Agent-Architecture.md.
  # ===========================================================================

  vllm-qwen:
    image: vllm/vllm-openai:nightly
    container_name: rtpi-vllm
    profiles:
      - vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"  # OpenAI-compatible API (localhost only)
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Command flags follow Inference-Agent-Architecture.md:
    # - reasoning-parser qwen3 enables thinking/non-thinking switching
    # - tool-call-parser qwen3_coder + enable-auto-tool-choice activates the
    #   XML-format tool calling Qwen3.5 was trained for
    # - language-model-only skips the vision encoder to save ~1GB VRAM
    # - speculative-config enables Multi-Token Prediction for ~3-5x decoding
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen3.5-9B}"
      - "--port=8000"
      - "--tensor-parallel-size=1"
      - "--max-model-len=131072"
      - "--reasoning-parser=qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=qwen3_coder"
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # docker-socket-proxy (v2.9.1 Phase 10 — KASM hardening)
  # When FF_KASM_HARDENED=true, KASM containers and the orchestrator's nested-
  # container helper route Docker calls through this proxy instead of mounting
  # /var/run/docker.sock directly. The proxy enforces a verb allowlist so a
  # compromised KASM host can't, e.g., create networks or destroy volumes.
  # Allowed: containers (read+write+exec) + images (read) + info.
  # Denied:  networks, volumes, services, swarm, tasks, system, build.
  # Usage: docker compose --profile kasm up -d (already brings KASM stack)
  # ===========================================================================

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: rtpi-docker-socket-proxy
    profiles:
      - kasm
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"  # localhost only — KASM containers reach via rtpi-network
    environment:
      # Verb allowlist (1=allow, 0=deny). Matches Phase 10 acceptance test:
      # `docker -H tcp://… network create` must return 403.
      - CONTAINERS=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - NETWORKS=0
      - VOLUMES=0
      - SERVICES=0
      - SWARM=0
      - TASKS=0
      - SYSTEM=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - PLUGINS=0
      - SECRETS=0
      - SESSION=0
      - POST=1   # required for /containers/:id/exec
      - DELETE=1 # required for nested-container teardown
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Docmost — Team documentation (v2.9.1 Phase 8)
  # Wiki-style docs platform; reports can be published here as pages.
  # Usage: docker compose --profile docmost up -d
  # Access: http://localhost:13000
  # First-run setup creates the initial workspace + admin user.
  # ===========================================================================

  docmost:
    image: docmost/docmost:latest
    container_name: rtpi-docmost
    profiles:
      - docmost
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - APP_URL=${DOCMOST_APP_URL:-http://localhost:13000}
      - APP_SECRET=${DOCMOST_APP_SECRET:-change-this-to-a-random-32-byte-secret}
      - DATABASE_URL=postgres://docmost:${DOCMOST_DB_PASSWORD:-docmostpassword}@postgres:5432/docmost
      - REDIS_URL=redis://default:${DOCMOST_REDIS_PASSWORD:-docmostredispassword}@docmost-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      docmost-redis:
        condition: service_healthy
    volumes:
      - docmost-data:/app/data/storage
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docmost-redis:
    image: bitnami/redis:latest
    container_name: rtpi-docmost-redis
    profiles:
      - docmost
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${DOCMOST_REDIS_PASSWORD:-docmostredispassword}
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Chromium Headless Shell (v2.9.1 Phase 3 — app-side PDF generation)
  # Small alpine-based Chrome devtools-protocol endpoint used by the
  # documentRenderer service. Bind 127.0.0.1 only — never exposed externally.
  # Usage: docker compose --profile pdf up -d
  # Set CHROMIUM_WS_ENDPOINT=ws://rtpi-chromium-shell:9222 in app env.
  # ===========================================================================

  chromium-shell:
    image: chromedp/headless-shell:latest
    container_name: rtpi-chromium-shell
    profiles:
      - pdf
    restart: unless-stopped
    # Defaults expose CDP on :9222 with no auth — keep on the rtpi-network only.
    ports:
      - "127.0.0.1:9222:9222"
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    # Hardening: read-only rootfs, no new privileges, drop capabilities.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,exec
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/9222) 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Portainer - Container Management UI
  # Usage: docker compose --profile management up -d
  # Access: https://localhost:9443
  # First login sets admin password
  # ===========================================================================

  portainer:
    image: portainer/portainer-ce:latest
    container_name: rtpi-portainer
    profiles:
      - management
    restart: unless-stopped
    ports:
      - "9443:9443"  # HTTPS UI
      - "8000:8000"  # Edge agent tunnel (optional)
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rtpi-network
    healthcheck:
      test: ["NONE"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Kasm Containerized Workspaces (optional — adds pre-built desktop images)
  # Requires the kasm profile: docker compose --profile kasm up -d
  # VS Code: http://localhost:6901
  # Kali: http://localhost:6902
  # Default VNC password: password  (change via VNC_PW env var)
  # ===========================================================================

  kasm-vscode:
    image: kasmweb/vs-code:1.16.0
    container_name: rtpi-kasm-vscode
    profiles:
      - kasm
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "6901:6901"  # VS Code web interface
    volumes:
      - kasm-vscode-data:/home/kasm-user
    environment:
      - VNC_PW=${KASM_VNC_PASSWORD:-password}
      - KASM_SVC_AUDIO=0
      - KASM_SVC_UPLOADS=1
      - KASM_SVC_DOWNLOADS=1
      - DISABLE_SSL=true
      - KASM_SVC_FORCE_HTTPS=0
    shm_size: "512m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rtpi-network
    # The kasm desktop image always returns 401 (auth required) on every
    # endpoint, so `curl -f` (fail on >=400) reports unhealthy even when the
    # server is up. Treat any 2xx/3xx/4xx response as healthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://localhost:6901/ | grep -qE '^[234]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kasm-kali:
    image: kasmweb/kali-rolling-desktop:1.16.0
    container_name: rtpi-kasm-kali
    profiles:
      - kasm
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "6902:6901"  # Kali web interface (mapped to different host port)
    volumes:
      - kasm-kali-data:/home/kasm-user
    environment:
      - VNC_PW=${KASM_VNC_PASSWORD:-password}
      - KASM_SVC_AUDIO=1
      - KASM_SVC_UPLOADS=1
      - KASM_SVC_DOWNLOADS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rtpi-network
    # See note on kasm-vscode — same 401-on-everything behavior.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://localhost:6901/ | grep -qE '^[234]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # v2.5 — mem0 Memory Infrastructure
  # ============================================================================

  # pgvector for mem0 vector store (separate from main postgres)
  mem0-postgres:
    image: pgvector/pgvector:pg16
    container_name: rtpi-mem0-postgres
    environment:
      POSTGRES_DB: rtpi_memory
      POSTGRES_USER: rtpi
      POSTGRES_PASSWORD: "${MEM0_POSTGRES_PASSWORD:-rtpi_mem0}"
    ports:
      - "5435:5432"
    volumes:
      - mem0-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtpi -d rtpi_memory"]
      interval: 10s
      retries: 5
    networks:
      - rtpi-network

  # Neo4j for mem0 graph store
  neo4j:
    image: neo4j:5-community
    container_name: rtpi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-rtpi_neo4j}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      retries: 5
    networks:
      - rtpi-network

  # mem0-api REMOVED in v3.10.3b Phase 0: replaced by native memory-service.ts
  # with pgvector. Python mem0 wrapper had zero TypeScript callers. Image: 656 MB.

  # ============================================================================
  # v2.5 LangGraph Orchestrator REMOVED in v3.10.3b Phase 1
  # Replaced by: ferry-orchestrator-client.ts → rust-nexus ferry gateway →
  # nexus-harness skill engine. All orchestrator routes dual-pathed via
  # FF_FERRY_BRIDGE. Python service (services/orchestrator/) deleted.
  # Image recovered: 656 MB. Docker socket mount eliminated.
  # ============================================================================

  # v2.5 offsec-cloud, offsec-llm-sec, offsec-web-injection REMOVED in v3.10.3b
  # Phase 2 (see offsec removal note above)

  # ============================================================================
  # v2.5 RE containers (ghidra-headless, aflplusplus) REMOVED in v3.10.3b
  # Phase 0: replaced by nexus-harness skills offense/reverse-engineering/
  # ghidra-headless + afl-fuzz. Images recovered: ~7.5 GB.
  # ============================================================================

  # ===========================================================================
  # Bootstrap — one-shot secret generator (profile: bootstrap)
  # Runs scripts/bootstrap-secrets.sh inside a minimal Alpine container.
  # Usage: docker compose --profile bootstrap run --rm rtpi-bootstrap
  # ===========================================================================
  rtpi-bootstrap:
    image: alpine:3.20
    container_name: rtpi-bootstrap
    profiles:
      - bootstrap
    volumes:
      - .:/workspace
      - ${HOME}/.rtpi:/root/.rtpi
    working_dir: /workspace
    environment:
      HOME: /root
    entrypoint:
      - sh
      - -c
      - "apk add --no-cache bash openssl util-linux coreutils >/dev/null && bash scripts/bootstrap-secrets.sh \"$@\""
      - --

  # ===========================================================================
  # VPN Manager (v2.9.2 Phase 1 — VPN Infrastructure Integration)
  # Long-running container that owns OpenVPN / WireGuard tunnel interfaces on
  # behalf of RTPI. The Phase 2 backend service writes uploaded .ovpn / .conf
  # files into the mounted vpn-configs / wg-configs volumes, then triggers
  # connect/disconnect via `docker exec rtpi-vpn-manager vpn-entrypoint.sh ...`.
  # Usage: docker compose --profile vpn up -d
  # Requires the host kernel to expose /dev/net/tun and the `wireguard` module.
  # ===========================================================================

  vpn-manager:
    build:
      context: ./docker/vpn-manager
      dockerfile: Dockerfile
    container_name: rtpi-vpn-manager
    profiles:
      - vpn
    restart: unless-stopped
    # Required to manage tun/wg interfaces and program iptables rules from
    # inside the container. SYS_MODULE is *not* added — the host loads the
    # wireguard kernel module; the container only uses the userspace tools.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - vpn-configs:/etc/openvpn/configs
      - wg-configs:/etc/wireguard/configs
      - vpn-logs:/var/log/vpn
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD", "/usr/local/bin/vpn-health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rtpi-network:
    driver: bridge

