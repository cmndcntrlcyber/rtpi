      - ./configs/rtpi-sysreptor/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - sysreptor-app
    networks:
      - rtpi-network
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7777"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
