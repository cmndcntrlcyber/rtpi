  # plus the shared base image are replaced by the single nexus-kali container
  # in nexus-harness with 260 skills and 280+ tools.
  # Images recovered: ~127 GB. Build time eliminated: ~2 hours.
  # Tool execution now routes through FF_FERRY_BRIDGE → harness-tool-executor.
