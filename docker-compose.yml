services:
  # PostgreSQL Database (pgvector for memory embeddings)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rtpi-postgres
    environment:
      POSTGRES_USER: rtpi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rtpi}
      POSTGRES_DB: rtpi_main
      SYSREPTOR_DB_PASSWORD: ${SYSREPTOR_DB_PASSWORD:-}
      DOCMOST_DB_PASSWORD: ${DOCMOST_DB_PASSWORD:-}
    ports:
      - "5434:5432"  # Changed from 5432 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro  # Creates sysreptor DB on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtpi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtpi-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rtpi-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6381:6379"  # Changed from 6379 to avoid conflicts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtpi-network

  # rtpi-tools REMOVED in v3.10.3b Phase 2: all tools available in nexus-kali
  # container via nexus-harness skills. Image recovered: 7.47 GB.
  # Tool execution now routes through FF_FERRY_BRIDGE → harness-tool-executor.

  # PowerShell Empire C2 Server
  empire-server:
    image: bcsecurity/empire:latest
    container_name: rtpi-empire
    ports:
      # REST API (1337) and Web UI (5001) proxied through empire-proxy
      - "8080-8100:8080-8100"  # Dynamic listener ports (direct, no proxy needed)
    environment:
      # Database connection (shared PostgreSQL)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rtpi_main
      POSTGRES_USER: rtpi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rtpi}
      # Empire configuration
      EMPIRE_USERNAME: empireadmin
      EMPIRE_PASSWORD: ${EMPIRE_PASSWORD:-Islamist-Repeal1-Unhealthy-Amulet-Survival}
      RESTPORT: 1337
      # Optional: Enable SocketIO for real-time events
      SOCKETIO_ENABLED: "true"
      SOCKETIO_PORT: 5002
    volumes:
      - empire-data:/opt/Empire/data
      - empire-downloads:/opt/Empire/downloads
      - shared-data:/shared
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://0.0.0.0:1337/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Empire Reverse Proxy — normalizes paths (fixes Starkiller //token double-slash)
  empire-proxy:
    image: nginx:alpine
    container_name: rtpi-empire-proxy
    ports:
      - "1337:1337"     # Empire REST API (proxied)
      - "5001:5001"     # Empire Web UI (proxied)
    volumes:
      - ./docker/empire-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - empire-server
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:1337/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ATT&CK Workbench MongoDB Database
  workbench-db:
    image: mongo:7
    container_name: rtpi-workbench-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: workbench
      MONGO_INITDB_ROOT_PASSWORD: ${WORKBENCH_DB_PASSWORD:-workbench123}
      MONGO_INITDB_DATABASE: attack-workbench
    ports:
      - "27017:27017"
    volumes:
      - workbench-db-data:/data/db
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u workbench -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ATT&CK Workbench REST API
  workbench-api:
    image: ghcr.io/center-for-threat-informed-defense/attack-workbench-rest-api:latest
    container_name: rtpi-workbench-api
    ports:
      - "3010:3010"
    environment:
      # MongoDB connection
      MONGODB_URL: mongodb://workbench:${WORKBENCH_DB_PASSWORD:-workbench123}@workbench-db:27017/attack-workbench?authSource=admin
      DATABASE_URL: mongodb://workbench:${WORKBENCH_DB_PASSWORD:-workbench123}@workbench-db:27017/attack-workbench?authSource=admin
      # API configuration
      PORT: 3010
      # CORS configuration - allow RTPI frontend
      CORS_ALLOWED_ORIGINS: "http://localhost:5000,http://localhost:3000,http://localhost:3001,http://localhost:3020,https://c3s-workbench.onoiroi.us,https://c3s.onoiroi.us"
      # Session configuration
      SESSION_SECRET: ${WORKBENCH_SESSION_SECRET:-change-this-secret-key}
      # Authentication (optional)
      AUTHN_MECHANISM: anonymous
    depends_on:
      workbench-db:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3010/api/collections > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ATT&CK Workbench Frontend (Optional - for direct access)
  workbench-frontend:
    image: ghcr.io/center-for-threat-informed-defense/attack-workbench-frontend:latest
    container_name: rtpi-workbench-frontend
    ports:
      - "3020:80"
    environment:
      # API endpoint configuration
      WORKBENCH_REST_API_URL: http://workbench-api:3010/api
    volumes:
      # Override the upstream image's stock nginx config which lacks both
      # an SPA history fallback (so /matrices, /tactics, etc. 404) and an
      # /api/ proxy (so the Angular SPA can't reach workbench-api).
      # See configs/rtpi-workbench/default.conf for the corrected config.
      - ./configs/rtpi-workbench/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      workbench-api:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Kasm Workspaces - Browser-Based Desktop Streaming Platform
  # All Kasm services are in the 'kasm' profile and must be explicitly enabled
  # Usage: docker compose --profile kasm up -d
  # ============================================================================

  # Kasm DB Certificate Init - Generates self-signed SSL certs for kasm-db
  kasm-db-init:
    image: alpine:latest
    container_name: rtpi-kasm-db-init
    profiles:
      - kasm  # Only start with Kasm profile
    volumes:
      - kasm-db-certs:/certs
      - ./scripts/kasm:/scripts:ro
    command: >
      sh -c "
        apk add --no-cache openssl &&
        /scripts/init-db-certs.sh
      "
    networks:
      - rtpi-network

  # Kasm Proxy Certificate Init - Generates self-signed nginx certs
  kasm-proxy-init:
    image: alpine:latest
    container_name: rtpi-kasm-proxy-init
    profiles:
      - kasm  # Only start with Kasm profile
    environment:
      KASM_SERVER_HOSTNAME: ${KASM_SERVER_HOSTNAME:-localhost}
    volumes:
      - kasm-certs:/certs
      - ./scripts/kasm:/scripts:ro
    command: >
      sh -c "
        apk add --no-cache openssl &&
        /scripts/init-proxy-certs.sh
      "
    networks:
      - rtpi-network

  # Kasm PostgreSQL Database (separate from main RTPI database)
  kasm-db:
    image: postgres:16-alpine
    container_name: rtpi-kasm-db
    profiles:
      - kasm  # Only start with Kasm profile
    # kasmweb/api 1.17.0 baked config requires SSL on the DB connection.
    # The kasm-db-certs volume is populated by kasm-db-init.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/kasm/db_server.crt
      - -c
      - ssl_key_file=/etc/ssl/certs/kasm/db_server.key
    environment:
      POSTGRES_USER: kasmapp
      POSTGRES_PASSWORD: ${KASM_DB_PASSWORD:-kasm123secure}
      # Do NOT set POSTGRES_DB: kasm — it creates an empty database that prevents
      # kasm-api's DB_AUTO_INITIALIZE from running schema migrations. Let kasm-api
      # create and populate the database itself on first start.
    ports:
      - "5433:5432"  # Different port to avoid conflict with main postgres
    volumes:
      - kasm-db-data:/var/lib/postgresql/data
      - kasm-db-certs:/etc/ssl/certs/kasm:ro
      # Loaded once on first init by the postgres image entrypoint.
      - ./scripts/kasm/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasmapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kasm-db-init:
        condition: service_completed_successfully
    networks:
      rtpi-network:
        aliases:
          - db  # kasmweb/api 1.17.0 baked config hardcodes hostname "db"
    restart: unless-stopped

  # Kasm Redis Cache (separate from main RTPI Redis)
  kasm-redis:
    image: redis:5-alpine
    container_name: rtpi-kasm-redis
    profiles:
      - kasm  # Only start with Kasm profile
    ports:
      - "6380:6379"  # Different port to avoid conflict with main redis
    volumes:
      - kasm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      rtpi-network:
        aliases:
          - kasm_redis  # kasmweb/api 1.17.0 baked config uses underscore form
    restart: unless-stopped

  # Kasm API Server - REST API for workspace management
  kasm-api:
    image: kasmweb/api:1.17.0
    container_name: rtpi-kasm-api
    profiles:
      - kasm  # Only start with Kasm profile
    # Run as root so the entrypoint can sed-patch /opt/kasm/current/conf/...
    # The image's default user "kasm" doesn't own that path.
    user: "0:0"
    environment:
      # POSTGRES_* env vars are read by /usr/bin/startup.sh for DB initialization.
      # The runtime API server reads its connection settings from
      # /opt/kasm/current/conf/app/api/api.app.config.yaml — which the
      # entrypoint below patches from these same env vars on every start.
      POSTGRES_HOST: kasm-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: kasmapp
      POSTGRES_PASSWORD: ${KASM_DB_PASSWORD:-kasm123secure}
      POSTGRES_DB: kasm
      DB_AUTO_INITIALIZE: "1"   # tells startup.sh to create schema if absent
      # API configuration
      API_SERVER_ID: ${KASM_API_SERVER_ID:-default}
      SERVER_HOSTNAME: ${KASM_SERVER_HOSTNAME:-localhost}
      SERVER_ZONE: default
      # SSL/TLS
      HTTPS_ENABLED: "true"
      SSL_CERT_FILE: /opt/kasm/current/certs/kasm_nginx.crt
      SSL_KEY_FILE: /opt/kasm/current/certs/kasm_nginx.key
    # Override the default entrypoint to patch the baked api.app.config.yaml
    # with the env-var values *before* startup.sh runs. The kasmweb/api:1.17.0
    # image hardcodes "password: changeme" / "redis_password: changeme" /
    # "host: db" in the YAML — these values win over the env vars at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - |
        CFG=/opt/kasm/current/conf/app/api/api.app.config.yaml
        if [ -f "$$CFG" ]; then
          sed -i "s|^  password: .*|  password: $${POSTGRES_PASSWORD}|" "$$CFG"
          sed -i 's|^  redis_password: .*|  redis_password: ""|' "$$CFG"
          echo "[kasm-api] Patched $$CFG"
        fi
        exec /usr/bin/startup.sh
    # No host port mapping — kasm-proxy fronts the API on the internal network.
    # Exposing 443 here would collide with kasm-proxy's 8443:443 binding.
    volumes:
      - kasm-api-data:/opt/kasm/current
      - kasm-certs:/opt/kasm/current/certs
    depends_on:
      kasm-db:
        condition: service_healthy
      kasm-redis:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      # API serves plain HTTP on 8080; HTTPS is terminated by kasm-proxy.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/__healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kasm Manager - Workspace lifecycle management
  kasm-manager:
    image: kasmweb/manager:1.17.0
    container_name: rtpi-kasm-manager
    profiles:
      - kasm  # Only start with Kasm profile
    # Run as root so the entrypoint can sed-patch the YAML in its own volume.
    user: "0:0"
    environment:
      # The kasmweb/manager image reads its DB/Redis config from
      # /opt/kasm/current/conf/app/api/api.app.config.yaml in its own volume.
      # We patch that YAML in the entrypoint below using these env vars.
      POSTGRES_PASSWORD: ${KASM_DB_PASSWORD:-kasm123secure}
      MANAGER_ID: ${KASM_MANAGER_ID:-default-manager}
      SERVER_HOSTNAME: ${KASM_SERVER_HOSTNAME:-localhost}
    entrypoint:
      - /bin/sh
      - -c
      - |
        CFG=/opt/kasm/current/conf/app/api/api.app.config.yaml
        if [ -f "$$CFG" ]; then
          sed -i "s|^  password: .*|  password: $${POSTGRES_PASSWORD}|" "$$CFG"
          sed -i 's|^  redis_password: .*|  redis_password: ""|' "$$CFG"
          echo "[kasm-manager] Patched $$CFG"
        fi
        exec python3 /src/api_server/manager_api_server.pyc --cfg "$$CFG"
    volumes:
      - kasm-manager-data:/opt/kasm/current
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for workspace management
    depends_on:
      kasm-db:
        condition: service_healthy
      kasm-redis:
        condition: service_healthy
      kasm-api:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kasm Proxy (Nginx) - Reverse proxy for workspace access
  kasm-proxy:
    image: nginx:alpine
    container_name: rtpi-kasm-proxy
    profiles:
      - kasm  # Only start with Kasm profile
    environment:
      - SERVER_HOSTNAME=${KASM_SERVER_HOSTNAME:-localhost}
      # Used by envsubst in default.conf.template — controls the redirect target.
      # Set to 443 in production behind real DNS on standard ports.
      - KASM_PUBLIC_HTTPS_PORT=${KASM_PUBLIC_HTTPS_PORT:-8443}
    ports:
      - "8443:443"  # HTTPS for workspace access
      - "8444:80"   # HTTP redirect to HTTPS (8080 reserved by rtpi-empire 8080-8100)
    volumes:
      # Kasm-aware nginx config template. nginx:alpine's entrypoint runs
      # envsubst over /etc/nginx/templates/*.template and writes the result
      # to /etc/nginx/conf.d/, so ${KASM_PUBLIC_HTTPS_PORT} is expanded once
      # at container start. Per-workspace configs are written by
      # KasmNginxManager into the containers.d/ subdir below.
      - ./docker/kasm-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - kasm-proxy-config:/etc/nginx/conf.d/containers.d
      - kasm-certs:/etc/nginx/certs:ro
    depends_on:
      kasm-proxy-init:
        condition: service_completed_successfully
      kasm-api:
        condition: service_healthy
      kasm-guac:
        condition: service_started
    networks:
      rtpi-network:
        aliases:
          - kasm_proxy
    restart: unless-stopped
    healthcheck:
      # Probe HTTPS with -k (self-signed) instead of HTTP, since :80 is just a redirect.
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://localhost:443/api/__healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kasm Guacamole - Remote desktop protocol gateway
  kasm-guac:
    image: kasmweb/kasm-guac:1.17.0
    container_name: rtpi-kasm-guac
    profiles:
      - kasm  # Only start with Kasm profile
    environment:
      # Database connection for session tracking
      POSTGRES_HOSTNAME: kasm-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: kasm
      POSTGRES_USER: kasmapp
      POSTGRES_PASSWORD: ${KASM_DB_PASSWORD:-kasm123secure}
      # Guacamole configuration
      GUACD_HOSTNAME: localhost
      GUACD_PORT: 4822
    ports:
      - "4822:4822"  # Guacamole daemon port
    volumes:
      - kasm-guac-data:/opt/kasm/current
    depends_on:
      kasm-db:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/4822) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kasm Agent - Workspace provisioning and monitoring
  kasm-agent:
    image: kasmweb/agent:1.17.0
    # The agent uses the Docker socket to inspect itself by container name
    # "kasm_agent" (hardcoded in the image). Keep this name verbatim — renaming
    # to rtpi-kasm-agent breaks self-registration.
    container_name: kasm_agent
    profiles:
      - kasm  # Only start with Kasm profile
    environment:
      # API connection
      API_HOSTNAME: kasm-api
      API_PORT: 443
      # Agent configuration
      AGENT_ID: ${KASM_AGENT_ID:-default-agent}
      SERVER_HOSTNAME: ${KASM_SERVER_HOSTNAME:-localhost}
      PUBLIC_HOSTNAME: ${KASM_PUBLIC_HOSTNAME:-localhost}
    volumes:
      - kasm-agent-data:/opt/kasm/current
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container management
    depends_on:
      kasm-api:
        condition: service_healthy
      kasm-manager:
        condition: service_started
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Kasm Share - File sharing service for workspaces
  kasm-share:
    image: kasmweb/share:1.17.0
    container_name: rtpi-kasm-share
    profiles:
      - kasm  # Only start with Kasm profile
    # Run as root so the entrypoint can sed-patch the YAML in the image layer.
    user: "0:0"
    environment:
      # Patched into api.app.config.yaml by the entrypoint below. The kasmweb/share
      # image hardcodes "password: changeme" in the YAML; without this patch the
      # share service hits "password authentication failed for user kasmapp"
      # against kasm-db.
      POSTGRES_PASSWORD: ${KASM_DB_PASSWORD:-kasm123secure}
      # Redis connection for share tracking
      REDIS_HOSTNAME: kasm-redis
      REDIS_PORT: 6379
      # Share service configuration
      SHARE_ID: ${KASM_SHARE_ID:-default-share}
    # Override the default entrypoint to patch the baked api.app.config.yaml
    # before launching share_server. Same pattern used by kasm-api and
    # kasm-manager — kasm-redis has no auth, so blank redis_password.
    entrypoint:
      - /bin/sh
      - -c
      - |
        CFG=/opt/kasm/current/conf/app/api/api.app.config.yaml
        if [ -f "$$CFG" ]; then
          sed -i "s|^  password: .*|  password: $${POSTGRES_PASSWORD}|" "$$CFG"
          sed -i 's|^  redis_password: .*|  redis_password: ""|' "$$CFG"
          echo "[kasm-share] Patched $$CFG"
        fi
        exec python3 /src/api_server/share_server.pyc --cfg "$$CFG"
    ports:
      - "8182:8182"  # File sharing port
    volumes:
      - kasm-share-data:/opt/kasm/current/shares
    depends_on:
      kasm-db:
        condition: service_healthy
      kasm-redis:
        condition: service_healthy
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",8182),2); s.close()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Certbot - Automated SSL/TLS certificate management
  # Supports both HTTP-01 and DNS-01 (Cloudflare) challenges
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: rtpi-certbot
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
      - CERTBOT_DOMAIN=${KASM_SERVER_HOSTNAME:-localhost}
      # Cloudflare API token for DNS-01 challenge (#KW-12)
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      # Container name to signal for an nginx reload after a renewal copy.
      # Defaults to rtpi-kasm-proxy in this stack.
      - KASM_NGINX_CONTAINER=${KASM_NGINX_CONTAINER:-rtpi-kasm-proxy}
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - kasm-certs:/etc/nginx/certs
      - ./scripts/ssl:/scripts/ssl:ro  # SSL automation scripts
      # Read-only docker socket so the renewal loop can `docker exec` an
      # nginx reload after copying new certs into kasm-certs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The certbot/dns-cloudflare image sets ENTRYPOINT ["certbot"], which would
    # cause our shell loop below to be passed as args to certbot. Override with
    # /bin/sh so `command:` is interpreted as a script. Use a literal block
    # scalar (|) — the previous folded (>) form collapsed multi-line if/fi
    # constructs into a single unparseable line.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Install docker-cli once so we can signal the kasm-proxy nginx for a reload.
        apk add --no-cache docker-cli >/dev/null 2>&1 || true

        # Create Cloudflare credentials if API token is set
        if [ -n "$$CLOUDFLARE_API_TOKEN" ]; then
          echo "dns_cloudflare_api_token = $$CLOUDFLARE_API_TOKEN" > /etc/letsencrypt/cloudflare.ini
          chmod 600 /etc/letsencrypt/cloudflare.ini
        fi

        # Certificate renewal loop (#KW-13)
        trap exit TERM
        while :; do
          # Renew certificates expiring within 30 days
          certbot renew --quiet

          cert_changed=0

          # Copy certificates to nginx directory
          if [ -d /etc/letsencrypt/live ]; then
            for domain in /etc/letsencrypt/live/*; do
              if [ -d "$$domain" ]; then
                domain_name=$$(basename "$$domain")
                cp -L "$$domain/fullchain.pem" "/etc/nginx/certs/$${domain_name}.crt" 2>/dev/null || true
                cp -L "$$domain/privkey.pem" "/etc/nginx/certs/$${domain_name}.key" 2>/dev/null || true

                # When this is the configured kasm hostname, also publish the
                # cert under the canonical filenames the kasm-proxy nginx
                # config loads (kasm_nginx.crt / kasm_nginx.key).
                if [ "$${domain_name}" = "$$CERTBOT_DOMAIN" ]; then
                  if ! cmp -s "$${domain}/fullchain.pem" /etc/nginx/certs/kasm_nginx.crt 2>/dev/null; then
                    cp -L "$${domain}/fullchain.pem" /etc/nginx/certs/kasm_nginx.crt
                    cp -L "$${domain}/privkey.pem"   /etc/nginx/certs/kasm_nginx.key
                    cert_changed=1
                  fi
                fi
              fi
            done
          fi

          # Reload kasm-proxy nginx so it picks up the new cert without dropping connections.
          if [ "$$cert_changed" = "1" ]; then
            docker exec "$$KASM_NGINX_CONTAINER" nginx -s reload 2>&1 || \
              echo "[certbot] warning: failed to reload $$KASM_NGINX_CONTAINER nginx (ok if not running yet)"
          fi

          # Renewal runs every 12 hours
          sleep 12h & wait $$!
        done
    networks:
      - rtpi-network
    restart: unless-stopped
    profiles:
      - certbot  # Optional profile - only start if SSL automation is needed

  # ===========================================================================
  # Local LLM Inference Services
  # ===========================================================================
  #
  # RKLLama (RK3588 NPU-accelerated inference) — RECOMMENDED for Orange Pi 5 Plus
  #
  # RKLLama runs as a native systemd service on the host (not in Docker) for
  # direct NPU device access. It implements the Ollama API on port 11434, so
  # RTPI connects via OLLAMA_HOST=http://localhost:11434 with zero changes.
  #
  # Setup:
  #   git clone https://github.com/notpunchnox/rkllama && cd rkllama
  #   pip install "packaging>=24.2" && pip install --no-build-isolation .
  #   rkllama_client pull qwen2.5:3b
  #   rkllama_client pull tinyllama:1.1b
  #   sudo cp scripts/rkllama.service /etc/systemd/system/
  #   sudo systemctl enable --now rkllama
  #
  # .env config:
  #   RKLLM_MODE=true
  #   PREFER_LOCAL_AI=true
  #   OLLAMA_HOST=http://localhost:11434
  #
  # The Ollama Docker services below are retained for non-RK3588 deployments.
  # They use Docker profiles and will NOT start unless explicitly activated.
  # ===========================================================================

  # Ollama (GPU-accelerated inference — for NVIDIA GPU deployments only)
  ollama:
    image: ollama/ollama:latest
    container_name: rtpi-ollama
    profiles:
      - gpu  # Only start if GPU is available (not used on RK3588)
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=30m  # Auto-unload after 30 min inactivity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama CPU Fallback (for systems without GPU or NPU)
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: rtpi-ollama-cpu
    profiles:
      - cpu  # Only start if no GPU/NPU available (not used on RK3588)
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1  # Limit parallelism on CPU
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m  # Auto-unload after 30 min inactivity
      - OLLAMA_NUM_THREAD=8  # CPU threads to use
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Open WebUI (LLM chat interface — connects to RKLLama on host)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rtpi-open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=false
      - WEBUI_NAME=RTPI Local LLM (RKLLama NPU)
    networks:
      - rtpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # OffSec Agent Containers REMOVED in v3.10.3b Phase 2
  # All 14 specialized containers (maldev, azure-ad, burp, empire, c3, sliver,
