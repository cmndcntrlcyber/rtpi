# RTPI Production SSL Proxy — generated for slug: attck
# Profiles: sysreptor management docmost kasm
# Cert path: /opt/rtpi/certs/attck/
# Source of truth: /home/cmndcntrl/code/rtpi/setup/services.manifest

ssl_certificate     /opt/rtpi/certs/attck/nginx.crt;
ssl_certificate_key /opt/rtpi/certs/attck/nginx.key;
ssl_session_timeout 1d;
ssl_session_cache   shared:SSL:50m;
ssl_session_tickets off;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
add_header Strict-Transport-Security "max-age=63072000" always;

# ─── attck.attck.nexus (gate=always) ─────
server { listen 80;  server_name attck.attck.nexus; return 301 https://$server_name$request_uri; }
server {
    listen 443 ssl http2; server_name attck.attck.nexus;
    client_max_body_size 900M;
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

