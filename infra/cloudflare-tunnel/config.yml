# Cloudflare Tunnel ingress rules — generated by build.sh Phase 3h from services.manifest
# Manual edits will be overwritten on next build. To add a subdomain, update
# rtpi/setup/services.manifest and re-run build.sh.
#
# Template variables (resolved by build.sh):
#   __TUNNEL_ID__    → CF_TUNNEL_NAME from .env
#   __SLUG__         → RTPI_SLUG from .env
#   __DOMAIN__       → RTPI_DOMAIN from .env

tunnel: __TUNNEL_ID__
credentials-file: /etc/cloudflared/__TUNNEL_ID__.json

ingress:
  # ── Primary entry point ──────────────────────────────────────────────────────
  # Kasm Workspace Portal (bare slug — reassigned from RTPI frontend in v4.3)
  - hostname: __SLUG__.__DOMAIN__
    service: https://localhost:8443
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── RTPI Admin (new -admin subdomain) ────────────────────────────────────────
  # Note: In v4.4+, the SPA is served from Cloudflare Pages. This tunnel route
  # handles the API backend only. The -admin hostname may resolve to Pages for
  # static assets and fall through to tunnel for /api/* via split DNS.
  - hostname: __SLUG__-admin.__DOMAIN__
    service: http://localhost:5000
    originRequest:
      connectTimeout: 10s

  # ── RTPI Express API (split DNS for Pages SPA) ──────────────────────────────
  - hostname: __SLUG__-api.__DOMAIN__
    service: http://localhost:3001
    originRequest:
      connectTimeout: 10s

  # ── Kasm Admin Console ──────────────────────────────────────────────────────
  - hostname: __SLUG__-kasm.__DOMAIN__
    service: https://localhost:8443
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── SysReptor (Caddy proxy) ─────────────────────────────────────────────────
  - hostname: __SLUG__-reports.__DOMAIN__
    service: http://localhost:7777
    originRequest:
      connectTimeout: 10s

  # ── Empire Starkiller ───────────────────────────────────────────────────────
  - hostname: __SLUG__-empire.__DOMAIN__
    service: http://localhost:1337
    originRequest:
      connectTimeout: 10s

  # ── Portainer ───────────────────────────────────────────────────────────────
  - hostname: __SLUG__-mgmt.__DOMAIN__
    service: https://localhost:9443
    originRequest:
      noTLSVerify: true
      connectTimeout: 10s

  # ── Docmost ─────────────────────────────────────────────────────────────────
  - hostname: __SLUG__-wiki.__DOMAIN__
    service: http://localhost:13000
    originRequest:
      connectTimeout: 10s

  # ── KasmVNC VS Code ─────────────────────────────────────────────────────────
  - hostname: __SLUG__-vscode.__DOMAIN__
    service: https://localhost:6901
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── KasmVNC Kali ────────────────────────────────────────────────────────────
  - hostname: __SLUG__-kali.__DOMAIN__
    service: https://localhost:6902
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ── ATT&CK Workbench ───────────────────────────────────────────────────────
  - hostname: __SLUG__-workbench.__DOMAIN__
    service: http://localhost:3020
    originRequest:
      connectTimeout: 10s

  # ── Catch-all ───────────────────────────────────────────────────────────────
  - service: http_status:404
